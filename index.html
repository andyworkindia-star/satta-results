<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satta King Fast Results & Monthly Chart</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; margin: 0; padding: 0; color: #333; }
        header { background-color: #1e3c72; color: white; padding: 15px; text-align: center; }
        .download-btn { background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 0; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .top-banner { background-color: #2ecc71; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; text-align: center; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; font-size: 15px; }
        .header-row th { background-color: #333; color: white; font-size: 14px; }
        .game-name-col { text-align: left; font-weight: bold; width: 50%; }
        .date-col { width: 25%; font-weight: bold; font-size: 17px; color: #d9534f; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .highlight-row { background-color: #f1c40f !important; color: #000; }
    </style>
</head>
<body>

    <header>
        <h2>Satta King Fast Results</h2>
        <p>Hamari Android App download karein!</p>
        <a href="https://drive.google.com/uc?export=download&id=1JfV3dwOf2shroLShkiaM0Trriugr0VWT" class="download-btn">📥 Download Android App</a>
    </header>

    <div class="container">
        <div class="top-banner">Satta King Fast Results of October 14, 2026 & October 13, 2026</div>
        
        <table>
            <thead>
                <tr class="header-row">
                    <th style="text-align: left; padding-left: 10px;">Regional Offline Draw Results</th>
                    <th>Tue.<br>13th</th>
                    <th>Wed.<br>14th</th>
                </tr>
            </thead>
            <tbody id="chart-body">
                <tr><td colspan="3" style="text-align:center; padding: 20px;">Loading results...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.10.12.0/firebase-app.js"; // Standard import
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOYsup23b0lc3kgH6ays_XnisNP1HztcU",
            authDomain: "galidisawarkingg.firebaseapp.com",
            databaseURL: "https://galidisawarkingg-default-rtdb.firebaseio.com",
            projectId: "galidisawarkingg",
            storageBucket: "galidisawarkingg.appspot.com",
            messagingSenderId: "143107893995",
            appId: "1:143107893995:web:fb8aadce0ab8732cc22cae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Aapke bataye gaye exact kram mein markets, aur DISAWAR hamesha sabse neeche
        const markets = [
            "BULANDSHAHR CITY",
            "ALIGARH CITY",
            "NOIDA NCR",
            "DELHI BAZAR",
            "SHREE GANESH",
            "FARIDABAD",
            "MATHURA KING",
            "GHAZIABAD",
            "GALI",
            "DISAWAR"
        ];

        const dbRef = ref(db, 'Oct 2026');
        
        onValue(dbRef, (snapshot) => {
            const tableBody = document.getElementById('chart-body');
            
            if (!snapshot.exists()) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Data not found!</td></tr>`;
                return;
            }

            const octData = snapshot.val() || {};
            const d13 = octData['13'] || {};
            const d14 = octData['14'] || {};
            
            tableBody.innerHTML = ""; 
            
            markets.forEach(market => {
                let res13 = "--";
                let res14 = "--";
                
                for (let k in d13) {
                    let cleanK = k.toUpperCase().trim();
                    let cleanMarket = market.toUpperCase().trim();
                    if (cleanK === cleanMarket || (cleanMarket === "SHREE GANESH" && cleanK.includes("SHREE"))) {
                        res13 = d13[k];
                        break;
                    }
                }

                for (let k in d14) {
                    let cleanK = k.toUpperCase().trim();
                    let cleanMarket = market.toUpperCase().trim();
                    if (cleanK === cleanMarket || (cleanMarket === "SHREE GANESH" && cleanK.includes("SHREE"))) {
                        res14 = d14[k];
                        break;
                    }
                }

                let rowHTML = `
                    <tr>
                        <td class="game-name-col">${market}</td>
                        <td class="date-col">${res13}</td>
                        <td class="date-col">${res14}</td>
                    </tr>
                `;
                tableBody.innerHTML += rowHTML;
            });
        });
    </script>
</body>
</html>
