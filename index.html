<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satta King Fast Results & Monthly Chart</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; margin: 0; padding: 0; color: #333; }
        header { background-color: #1e3c72; color: white; padding: 15px; text-align: center; }
        .download-btn { background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .live-header { background-color: #2ecc71; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 18px; margin-top: 10px; }
        
        /* Chart Section Styling */
        .chart-section { margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 10px; font-size: 16px; }
        th { background-color: #f1c40f; color: #000; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .game-result { font-weight: bold; color: #d9534f; font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <h2>Satta King Fast Results</h2>
        <p>Hamari Android App download karein!</p>
        <a href="https://drive.google.com/uc?export=download&id=1JfV3dwOf2shroLShkiaM0Trriugr0VWT" class="download-btn">📥 Download Android App</a>
    </header>

    <div class="container">
        <!-- LIVE RESULTS -->
        <div class="live-header">🟢 Live Results - 14 October</div>
        
        <div class="chart-section">
            <table>
                <thead>
                    <tr>
                        <th>GAME NAME</th>
                        <th>RESULT</th>
                    </tr>
                </thead>
                <tbody id="chart-body">
                    <tr><td colspan="2" style="text-align:center;">Loading markets...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOYsup23b0lc3kgH6ays_XnisNP1HztcU",
            authDomain: "galidisawarkingg.firebaseapp.com",
            databaseURL: "https://galidisawarkingg-default-rtdb.firebaseio.com",
            projectId: "galidisawarkingg",
            storageBucket: "galidisawarkingg.appspot.com",
            messagingSenderId: "143107893995",
            appId: "1:143107893995:web:fb8aadce0ab8732cc22cae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Aapki di gayi fix market list
        const markets = [
            "Bulandshahr City",
            "Delhi Bazar",
            "Shree Ganesh",
            "Faridabad",
            "Ghaziabad",
            "Gali",
            "Disawar",
            "Noida NCR"
        ];

        const dayRef = ref(db, 'MonthlyCharts/14');
        onValue(dayRef, (snapshot) => {
            const dbData = snapshot.val() || {};
            const tableBody = document.getElementById('chart-body');
            tableBody.innerHTML = ""; 
            
            markets.forEach(market => {
                let resultValue = "--";
                
                // Database se match karne ki koshish (case-insensitive)
                for (let key in dbData) {
                    if (key.trim().toLowerCase() === market.trim().toLowerCase()) {
                        resultValue = dbData[key];
                        break;
                    }
                }

                let rowHTML = `
                    <tr>
                        <td style="font-weight: bold; text-align: left; padding-left: 15px;">${market}</td>
                        <td class="game-result">${resultValue}</td>
                    </tr>
                `;
                tableBody.innerHTML += rowHTML;
            });
        });
    </script>
</body>
</html>
