<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satta King Fast Results & Monthly Chart</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; margin: 0; padding: 0; color: #333; }
        header { background-color: #1e3c72; color: white; padding: 15px; text-align: center; }
        .download-btn { background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .live-header { background-color: #2ecc71; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 18px; margin-top: 10px; }
        .game-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #ddd; align-items: center; }
        .game-name { font-weight: bold; font-size: 16px; }
        .game-time { font-size: 12px; color: #666; }
        .game-result { font-size: 20px; font-weight: bold; color: #d9534f; }
        
        /* Chart Section Styling */
        .chart-section { margin-top: 20px; }
        .chart-title { background-color: #f39c12; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
        th { background-color: #f1c40f; color: #000; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .nav-buttons { display: flex; justify-content: space-between; margin: 15px 0; }
        .nav-buttons a { background: #007bff; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h2>Satta King Fast Results</h2>
        <p>Hamari Android App download karein!</p>
        <a href="https://drive.google.com/uc?export=download&id=1JfV3dwOf2shroLShkiaM0Trriugr0VWT" class="download-btn">📥 Download Android App</a>
    </header>

    <div class="container">
        <!-- LIVE RESULTS -->
        <div class="live-header">🟢 Live Results Today</div>
        
        <div class="game-row">
            <div>
                <div class="game-name">FARIDABAD</div>
                <div class="game-time">at 06:00 PM</div>
            </div>
            <div class="game-result" id="frbd-result">--</div>
        </div>

        <div class="game-row">
            <div>
                <div class="game-name">GHAZIABAD</div>
                <div class="game-time">at 08:00 PM</div>
            </div>
            <div class="game-result" id="gzbd-result">--</div>
        </div>

        <!-- MONTHLY CHART SECTION -->
        <div class="chart-section">
            <div class="chart-title">Monthly Result Chart - October 2026</div>
            
            <table>
                <thead>
                    <tr>
                        <th>DATE</th>
                        <th>FRBD</th>
                        <th>GZBD</th>
                    </tr>
                </thead>
                <tbody id="chart-body">
                    <!-- Firebase se data yahan automatically aayega -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOYsup23b0lc3kgH6ays_XnisNP1HztcU",
            authDomain: "galidisawarkingg.firebaseapp.com",
            databaseURL: "https://galidisawarkingg-default-rtdb.firebaseio.com",
            projectId: "galidisawarkingg",
            storageBucket: "galidisawarkingg.appspot.com",
            messagingSenderId: "143107893995",
            appId: "1:143107893995:web:fb8aadce0ab8732cc22cae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Live Results Realtime Fetching
        const resultsRef = ref(db, 'results/today');
        onValue(resultsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.frbd) document.getElementById('frbd-result').innerText = data.frbd;
                if(data.gzbd) document.getElementById('gzbd-result').innerText = data.gzbd;
            }
        });
    </script>
</body>
</html>
